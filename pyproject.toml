[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quill-fuzzer"
version = "0.2.0"
description = "Adversarial-prompt fuzzer for LLMs"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10"
dependencies = ["rich", "requests"]  # add requests for HTTP client

[project.scripts]
quill = "quill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["quill"]

[tool.hatch.build.targets.sdist]
include = ["quill", "quill.py", "README.md"]
